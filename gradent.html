<html>
    <head>
        <tittle>gradent example</tittle>
        <style type="text/css">
            .box{
                width:250px;
                height:120px;
                margin:20px;
                color:green;
                font-weight:bold;
            }
            .linear{
                background:linear-gradient(to bottom,rgb(0, 128, 117),rgb(255, 0, 179));
            }
            .radial{
                background:radial-gradient(circle ,rgb(0, 81, 128),rgb(255, 251, 192));
            }
        </style>
    </head>
    <body>
        <h2>css3 gradient example</h2>
        <div class="box linear">liner gradient</div>
        <div class="box radial"> radial color</div>
    </body>
</html>
